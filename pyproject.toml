[project]
name = "climate-twins"
version = "0.1.0"
description = "Find places whose climate resembles a given location, from TerraClimate 1991-2020 normals."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "netcdf4>=1.7.4",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "scipy>=1.18.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[project.scripts]
climate-twins-build = "climate_twins.build:main"
climate-twins-serve = "climate_twins.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
