app = "climate-twins"
primary_region = "iad"

[env]
  # Fewer glibc malloc arenas, each holding on to memory freed by searches: ~0.1 GB less settled.
  MALLOC_ARENA_MAX = "2"
  # Fly's proxy terminates TLS: trust its X-Forwarded-Proto, so pages link to https on the real host.
  FORWARDED_ALLOW_IPS = "*"

[http_service]
  internal_port = 8000
  force_https = true
  # Suspend needs at most 2 GB of memory and no swap.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  # Heavy requests (searches, pages, cards) run two at a time and queue in the server without a
  # thread; the rest (tiles) share its pool of 40.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 25
    hard_limit = 40

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"

[[mounts]]
  source = "climate_twins_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"
