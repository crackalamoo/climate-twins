<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f1e3">
  <title>Climate Twins</title>
  <link rel="icon" type="image/png" sizes="32x32" href="https://www.harysdalvi.com/assets/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="https://www.harysdalvi.com/assets/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://www.harysdalvi.com/assets/favicon/apple-touch-icon.png">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main id="map"></main>
  <div id="legend" class="legend" hidden></div>

  <aside id="panel">
    <header class="intro">
      <h1>Climate Twins</h1>
      <p>Find places around the world whose climate is most like yours.</p>
    </header>

    <div class="search-row">
      <div class="search">
        <input id="search" type="search" placeholder="Search a place…" autocomplete="off"
               role="combobox" aria-expanded="false" aria-controls="suggestions" aria-autocomplete="list">
        <ul id="suggestions" role="listbox" hidden></ul>
      </div>
      <button id="locate" type="button" title="Use my location">My location</button>
    </div>

    <section id="empty" class="start">
      <p class="howto">Search for a city or town, use My location, or click anywhere on land.</p>
    </section>

    <button id="adjust" class="adjust" type="button" aria-expanded="false" aria-controls="controls">Adjust</button>

    <div id="controls" class="controls">
      <label title="Ignore matches this close to the query">
        <span>Exclude within <output id="exclude-out">1,500 km</output></span>
        <input id="exclude" type="range" min="0" max="3000" step="50" value="1500">
      </label>
      <label title="Minimum spacing between results">
        <span>Spacing <output id="suppress-out">400 km</output></span>
        <input id="suppress" type="range" min="0" max="2000" step="50" value="400">
      </label>
      <label class="check" title="Also match places whose seasons are 6 months offset (e.g. the other hemisphere)">
        <input id="align" type="checkbox" checked> Allow season shift
      </label>
      <div id="units" class="units" role="group" aria-label="Units">
        <button type="button" data-units="metric" aria-pressed="true">°C · mm · km</button>
        <button type="button" data-units="us" aria-pressed="false">°F · in · mi</button>
      </div>
    </div>

    <p id="message" class="message" hidden></p>

    <!-- One match at a time, Google Maps style: the list, or one match's comparison in its place -->
    <div id="list" class="view">
      <section id="query-summary" hidden></section>
      <ol id="results"></ol>
    </div>

    <section id="detail" class="view" hidden>
      <nav class="detail-nav" aria-label="Climate twins">
        <button id="back" class="back" type="button">← All twins</button>
        <span class="stepper">
          <button id="prev" type="button" aria-label="Previous twin" title="Previous twin (←)">‹</button>
          <span id="position"></span>
          <button id="next" type="button" aria-label="Next twin" title="Next twin (→)">›</button>
        </span>
      </nav>
      <div id="compare"></div>
      <nav class="pager" aria-label="Neighbouring twins">
        <button id="pager-prev" class="prev-twin" type="button"></button>
        <button id="pager-next" class="next-twin" type="button"></button>
      </nav>
    </section>

    <!-- GeoNames is CC BY: credit it beside the names it supplies. The basemap's credit is the map's. -->
    <footer class="credits">
      Climate data: <a href="https://www.climatologylab.org/terraclimate.html" target="_blank" rel="noopener">TerraClimate</a>
      · Place names: <a href="https://www.geonames.org/" target="_blank" rel="noopener">GeoNames</a>
      <br>By <a href="https://www.harysdalvi.com" target="_blank" rel="noopener">Harys Dalvi</a>
      · <a href="https://github.com/crackalamoo/climate-twins" target="_blank" rel="noopener">Source on GitHub</a>
    </footer>
  </aside>
</body>
</html>
